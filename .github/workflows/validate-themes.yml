name: Validate themes

on:
  pull_request:
    paths:
      - "themes/**"
      - ".github/scripts/validate_themes.py"
      - ".github/workflows/validate-themes.yml"
  push:
    branches: [main]
    paths:
      - "themes/**"
      - ".github/scripts/validate_themes.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate every themes/*.json
        run: python .github/scripts/validate_themes.py
